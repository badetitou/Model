<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Model — a language-neutral model of your codebase">
  <title>Model</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="0.55" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <g fill="#000000">
        <circle cx="56" cy="78" r="11.5"/>
        <circle cx="200" cy="78" r="11.5"/>
        <circle cx="56" cy="190" r="11.5"/>
        <circle cx="200" cy="190" r="11.5"/>
        <circle cx="128" cy="150" r="6.5"/>
      </g>
    </mask>
  </defs>

  <rect width="1280" height="640" fill="#070B18"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <ellipse cx="260" cy="80" rx="620" ry="420" fill="url(#glowA)"/>
  <ellipse cx="1080" cy="620" rx="680" ry="440" fill="url(#glowB)"/>

  <g transform="translate(486.4 -19.2) scale(1.2)">
    <g mask="url(#holes)">
      <path d="M56 190 V78 L128 150 L200 78 V190" fill="none" stroke="url(#ink)"
            stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="none" stroke="url(#ink)" stroke-width="7">
        <circle cx="56" cy="78" r="15"/>
        <circle cx="200" cy="78" r="15"/>
        <circle cx="56" cy="190" r="15"/>
        <circle cx="200" cy="190" r="15"/>
      </g>
      <circle cx="128" cy="150" r="17" fill="url(#ink)"/>
    </g>
  </g>

  <rect x="592" y="505" width="96" height="3" rx="1.5" fill="url(#ink)" opacity="0.85"/>
</svg>
