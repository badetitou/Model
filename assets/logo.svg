<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Model">
  <title>Model</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#161B33"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="0.55" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.30" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <g fill="#000000">
        <circle cx="56" cy="78" r="11.5"/>
        <circle cx="200" cy="78" r="11.5"/>
        <circle cx="56" cy="190" r="11.5"/>
        <circle cx="200" cy="190" r="11.5"/>
        <circle cx="128" cy="150" r="6.5"/>
      </g>
    </mask>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#halo)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>

  <g mask="url(#holes)">
    <path d="M56 190 V78 L128 150 L200 78 V190" fill="none" stroke="url(#ink)"
