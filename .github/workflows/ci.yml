name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fixture tests (`MODEL_FIXTURES`) are skipped: they need real
      # projects and their SCIP indexes.
      - run: cargo test --workspace --locked

  # Grammars are optional features: each must build alone.
  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p model-treesitter --locked --no-default-features
      - run: |
          for f in java typescript python; do
            cargo check -p model-treesitter --locked --no-default-features --features "$f"
          done

  # `rust-version` in Cargo.toml, also pinned by rust-toolchain.toml.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  # Tag-driven release: only after every check above has passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, features, msrv]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag matches the workspace version
        run: |
          version="$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME#v}"
          [ "$version" = "$tag" ] || {
            echo "tag v$tag does not match Cargo.toml $version" >&2
            exit 1
          }
      - name: Check that the crates.io token is configured
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || {
            echo "Add the CARGO_REGISTRY_TOKEN secret to this repository." >&2
            exit 1
          }
      - name: Publish all crates in dependency order
        run: ./scripts/publish.sh "${GITHUB_REF_NAME#v}"
      - name: Build release notes from the changelog
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
