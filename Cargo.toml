[workspace]
resolver = "3"
members = [
    "crates/model-core",
    "crates/model-detect",
    "crates/model-scip",
    "crates/model-link",
    "crates/model-treesitter",
    "crates/model-index",
    "crates/model",
    "crates/model-analysis",
    "crates/model-graphql",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/badetitou/Model"
rust-version = "1.100"
# Consumed as a git dependency (`tag = "v…"`), not from crates.io.
publish = false

[workspace.dependencies]
model-core = { path = "crates/model-core" }
model-scip = { path = "crates/model-scip" }
model-detect = { path = "crates/model-detect" }
model-link = { path = "crates/model-link" }
model-treesitter = { path = "crates/model-treesitter" }
model-index = { path = "crates/model-index" }
model = { path = "crates/model" }
model-analysis = { path = "crates/model-analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ignore = "0.4"
scip = "0.10"
protobuf = "3"
rayon = "1"
tree-sitter = "0.27"
async-graphql = "7.2"
async-graphql-axum = "7.2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tree-sitter-java = "0.23.5"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25"
