[workspace]
resolver = "3"
members = [
    "crates/model-core",
    "crates/model-fm3",
    "crates/model-traits",
    "crates/model-moose",
    "crates/model-detect",
    "crates/model-scip",
    "crates/model-link",
    "crates/model-treesitter",
    "crates/model-index",
    "crates/model-lang-pharo",
    "crates/model-factory",
    "crates/model-session",
    "crates/model-analysis",
    "crates/model-graphql",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/badetitou/Model"
rust-version = "1.100"
publish = true

[workspace.dependencies]
model-core = { path = "crates/model-core", version = "0.3.0" }
model-fm3 = { path = "crates/model-fm3", version = "0.3.0" }
model-traits = { path = "crates/model-traits", version = "0.3.0" }
model-moose = { path = "crates/model-moose", version = "0.3.0" }
model-scip = { path = "crates/model-scip", version = "0.3.0" }
model-detect = { path = "crates/model-detect", version = "0.3.0" }
model-link = { path = "crates/model-link", version = "0.3.0" }
model-treesitter = { path = "crates/model-treesitter", version = "0.3.0" }
model-index = { path = "crates/model-index", version = "0.3.0" }
model-lang-pharo = { path = "crates/model-lang-pharo", version = "0.3.0" }
model-factory = { path = "crates/model-factory", version = "0.3.0" }
model-session = { path = "crates/model-session", version = "0.3.0" }
model-analysis = { path = "crates/model-analysis", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ignore = "0.4"
scip = "0.10"
protobuf = "3"
rayon = "1"
tree-sitter = "0.27"
async-graphql = "7.2"
async-graphql-axum = "7.2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tree-sitter-java = "0.23.5"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25"
