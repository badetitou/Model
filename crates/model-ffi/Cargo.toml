[package]
name = "model-ffi"
description = "C ABI over a frozen Model: flat columns for foreign importers (Pharo UFFI...)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["ffi", "uffi", "pharo", "moose", "code-model"]
categories = ["development-tools", "external-ffi-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# `model_build`: build a model from sources in-process (no model.json). Pulls
# every language frontend and indexer driver of `model-factory`.
build = ["dep:model-factory"]

[dependencies]
model-core.workspace = true
serde_json.workspace = true
model-factory = { workspace = true, optional = true }
