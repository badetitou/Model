[package]
name = "model-graphql"
description = "Serves a model over GraphQL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["code-analysis", "static-analysis", "tree-sitter", "scip", "code-model"]
categories = ["development-tools"]

[[bin]]
name = "model-graphql"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# The HTTP server (axum), the `model-graphql` binary and the on-demand session. Without it the crate
# is only the executable schema, which compiles to WebAssembly (see `model-wasm`).
server = [
    "dep:anyhow",
    "dep:model-factory",
    "dep:model-session",
    "dep:async-graphql-axum",
    "dep:axum",
    "dep:tower-http",
    "dep:tokio",
]

[dependencies]
model-factory = { workspace = true, optional = true }
model-core.workspace = true
model-analysis.workspace = true
model-session = { workspace = true, optional = true }
model-traits.workspace = true
anyhow = { workspace = true, optional = true }
async-graphql.workspace = true
async-graphql-axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
protobuf.workspace = true
scip.workspace = true
model-lang-pharo.workspace = true
model-treesitter.workspace = true
