[package]
name = "model-mcp"
description = "MCP server keeping a Model in memory for coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords = ["code-analysis", "static-analysis", "mcp", "code-model"]
categories = ["development-tools"]

[[bin]]
name = "model-mcp"
path = "src/main.rs"

[dependencies]
model-cli.workspace = true
model-core.workspace = true
model-analysis.workspace = true
model-factory.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The derive expands to `schemars::…` paths, so it must be a direct dependency.
schemars = { version = "1", features = ["derive"] }
# Official MCP SDK: server, `#[tool]` macros, JSON schemas and stdio transport.
rmcp = { version = "3.11.0", features = ["server", "macros", "schemars", "transport-io"] }
